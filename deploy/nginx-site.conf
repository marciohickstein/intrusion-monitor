# /etc/nginx/sites-available/intrusion-monitor
# Depois de ativar, rode: certbot --nginx -d __DOMAIN__  (adiciona o bloco HTTPS)
limit_req_zone $binary_remote_addr zone=im_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    access_log /var/log/nginx/intrusion-monitor.access.log;
    error_log  /var/log/nginx/intrusion-monitor.error.log;

    location = /login {
        limit_req zone=im_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/intrusion-monitor-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/intrusion-monitor-proxy.conf;
    }
}
